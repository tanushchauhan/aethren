<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="1200" height="470" rx="18" fill="#0b1115"/>
  <rect x="1" y="1" width="1198" height="468" rx="18" fill="none" stroke="#2a363c"/>

  <!-- card template: 270 x 190, 4 columns × 2 rows -->
  <g font-size="12.5">
    <!-- Dial -->
    <g transform="translate(30,30)">
      <rect width="270" height="190" rx="10" fill="#141d22" stroke="#d9b45a" stroke-width="1.5"/>
      <circle cx="44" cy="46" r="22" fill="none" stroke="#d9b45a" stroke-width="2"/>
      <circle cx="44" cy="46" r="15" fill="none" stroke="#d9b45a" stroke-dasharray="2 3"/>
      <line x1="44" y1="46" x2="53" y2="31" stroke="#d9b45a" stroke-width="2.5" stroke-linecap="round"/>
      <text x="80" y="42" font-size="17" font-weight="700" fill="#f1e3bd">Rotary dial</text>
      <text x="80" y="62" fill="#8a7a55">socket A0</text>
      <text x="20" y="104" fill="#e8dfc8">Spin the 12-slot</text>
      <text x="20" y="124" fill="#e8dfc8">spell wheel</text>
      <text x="20" y="152" fill="#8f9a9b">Browse every menu</text>
      <text x="20" y="172" fill="#8f9a9b">key: ← →</text>
    </g>
    <!-- B1 -->
    <g transform="translate(320,30)">
      <rect width="270" height="190" rx="10" fill="#141d22" stroke="#d9b45a" stroke-width="1.5"/>
      <rect x="22" y="24" width="44" height="44" rx="8" fill="#2a2416" stroke="#d9b45a" stroke-width="2"/>
      <text x="44" y="52" font-size="15" font-weight="700" fill="#f1e3bd" text-anchor="middle">B1</text>
      <text x="80" y="42" font-size="17" font-weight="700" fill="#f1e3bd">Button 1</text>
      <text x="80" y="62" fill="#8a7a55">socket D4</text>
      <text x="20" y="104" fill="#e8dfc8">Begin a ritual</text>
      <text x="20" y="124" fill="#e8dfc8">Ritual step "B1"</text>
      <text x="20" y="152" fill="#8f9a9b">Confirm / Next</text>
      <text x="20" y="172" fill="#8f9a9b">key: 1 · Enter</text>
    </g>
    <!-- B2 -->
    <g transform="translate(610,30)">
      <rect width="270" height="190" rx="10" fill="#141d22" stroke="#d9b45a" stroke-width="1.5"/>
      <rect x="22" y="24" width="44" height="44" rx="8" fill="#2a2416" stroke="#d9b45a" stroke-width="2"/>
      <text x="44" y="52" font-size="15" font-weight="700" fill="#f1e3bd" text-anchor="middle">B2</text>
      <text x="80" y="42" font-size="17" font-weight="700" fill="#f1e3bd">Button 2</text>
      <text x="80" y="62" fill="#8a7a55">socket D8</text>
      <text x="20" y="104" fill="#e8dfc8">Tap: next element</text>
      <text x="20" y="124" fill="#e8dfc8">Hold: Rest (+3 MP)</text>
      <text x="20" y="152" fill="#8f9a9b">Enemy turn: parry</text>
      <text x="20" y="172" fill="#8f9a9b">key: 2</text>
    </g>
    <!-- Touch -->
    <g transform="translate(900,30)">
      <rect width="270" height="190" rx="10" fill="#141d22" stroke="#d9b45a" stroke-width="1.5"/>
      <circle cx="44" cy="46" r="22" fill="#2a2416" stroke="#d9b45a" stroke-width="2"/>
      <path d="M36,56 v-14 a4,4 0 0 1 8,0 v8 M44,48 a4,4 0 0 1 8,0 v8" fill="none" stroke="#f1e3bd" stroke-width="2" stroke-linecap="round"/>
      <text x="80" y="42" font-size="17" font-weight="700" fill="#f1e3bd">Touch pad T</text>
      <text x="80" y="62" fill="#8a7a55">socket D7 / D3</text>
      <text x="20" y="104" fill="#e8dfc8">Switch target</text>
      <text x="20" y="124" fill="#e8dfc8">Enemy turn: parry</text>
      <text x="20" y="152" fill="#8f9a9b">Hold: settings</text>
      <text x="20" y="172" fill="#8f9a9b">key: 3 · T · Tab</text>
    </g>

    <!-- Accelerometer -->
    <g transform="translate(30,250)">
      <rect width="270" height="190" rx="10" fill="#141d22" stroke="#c49bff" stroke-width="1.5"/>
      <path d="M24,62 q20,-40 40,-20 q12,12 -4,24" fill="none" stroke="#c49bff" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M22,38 l6,-8 M30,30 l-8,0" stroke="#c49bff" stroke-width="2" stroke-linecap="round"/>
      <text x="80" y="42" font-size="17" font-weight="700" fill="#ece0ff">Accelerometer</text>
      <text x="80" y="62" fill="#7f6aa6">I2C · auto-detected</text>
      <text x="20" y="104" fill="#e8dfc8">Swing: slash, thrust</text>
      <text x="20" y="124" fill="#e8dfc8">or shake (≥1.85 g)</text>
      <text x="20" y="152" fill="#8f9a9b">Harder = ×1.15–1.45</text>
      <text x="20" y="172" fill="#8f9a9b">key: Space</text>
    </g>
    <!-- Webcam -->
    <g transform="translate(320,250)">
      <rect width="270" height="190" rx="10" fill="#141d22" stroke="#c49bff" stroke-width="1.5"/>
      <circle cx="44" cy="30" r="7" fill="none" stroke="#c49bff" stroke-width="2"/>
      <path d="M44,37 v18 M44,55 l-8,13 M44,55 l8,13 M44,44 l-12,6 M44,44 l10,-14" fill="none" stroke="#c49bff" stroke-width="2" stroke-linecap="round"/>
      <text x="80" y="42" font-size="17" font-weight="700" fill="#ece0ff">Webcam pose</text>
      <text x="80" y="62" fill="#7f6aa6">MediaPipe, on-device</text>
      <text x="20" y="104" fill="#e8dfc8">Raise arm: ritual step</text>
      <text x="20" y="124" fill="#e8dfc8">Dodge, duck, block</text>
      <text x="20" y="152" fill="#8f9a9b">Calibrates in 25 frames</text>
      <text x="20" y="172" fill="#8f9a9b">key: W</text>
    </g>
    <!-- Buzzer -->
    <g transform="translate(610,250)">
      <rect width="270" height="190" rx="10" fill="#141d22" stroke="#4fb3a9" stroke-width="1.5"/>
      <path d="M24,38 h10 l14,-12 v40 l-14,-12 h-10 z" fill="#122023" stroke="#4fb3a9" stroke-width="2" stroke-linejoin="round"/>
      <path d="M56,36 q6,10 0,20 M62,30 q12,16 0,32" fill="none" stroke="#4fb3a9" stroke-width="2" stroke-linecap="round"/>
      <text x="80" y="42" font-size="17" font-weight="700" fill="#d8f2ee">Buzzer</text>
      <text x="80" y="62" fill="#3f8a82">socket D5</text>
      <text x="20" y="104" fill="#e8dfc8">tick · cast · fizzle</text>
      <text x="20" y="124" fill="#e8dfc8">hit</text>
      <text x="20" y="152" fill="#8f9a9b">Feel the fight without</text>
      <text x="20" y="172" fill="#8f9a9b">looking at the screen</text>
    </g>
    <!-- LCD -->
    <g transform="translate(900,250)">
      <rect width="270" height="190" rx="10" fill="#141d22" stroke="#4fb3a9" stroke-width="1.5"/>
      <rect x="20" y="28" width="50" height="30" rx="3" fill="#183a2e" stroke="#4fb3a9" stroke-width="2"/>
      <text x="45" y="47" font-size="9" fill="#9fffd6" text-anchor="middle">G1 OK</text>
      <text x="80" y="42" font-size="17" font-weight="700" fill="#d8f2ee">RGB LCD</text>
      <text x="80" y="62" fill="#3f8a82">I2C · 16x2</text>
      <text x="20" y="104" fill="#e8dfc8">Glove id, IP, hub</text>
      <text x="20" y="124" fill="#e8dfc8">status, live sensors</text>
      <text x="20" y="152" fill="#8f9a9b">Orange → green → red</text>
      <text x="20" y="172" fill="#8f9a9b">tells Wi-Fi health</text>
    </g>
  </g>
</svg>
